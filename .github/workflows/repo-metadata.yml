name: Repo Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  administration: write
  contents: read

jobs:
  update_repo_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: "Asthma lactylation/RCC2 analysis code with manuscript-ordered methods and reproducible ML benchmark tables.",
              homepage: ""
            });
